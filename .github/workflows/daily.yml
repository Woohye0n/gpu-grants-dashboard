# 매일 공고를 수집해 docs/ 를 GitHub Pages 로 배포합니다.
# Pages 는 configure-pages 가 자동으로 켭니다. 실패하면 Settings > Pages > Source 를
# "GitHub Actions" 로 직접 바꿔 주세요.
name: daily-collect

on:
  push:
    branches: [main]           # 코드가 바뀌면 바로 다시 배포
  schedule:
    - cron: "10 0 * * *"      # 00:10 UTC = 09:10 KST
  workflow_dispatch:           # 수동 실행 버튼

permissions:
  contents: write              # 수집 결과 커밋
  pages: write                 # Pages 배포
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true     # 새 실행이 멈춰 있는 이전 실행을 취소

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 의존성 하나가 빠지면 수집이 통째로 죽는다. 여기서 먼저 크게 실패시킨다.
      - name: 의존성 자가점검
        run: python -c "import scraper.run, scraper.probe, scraper.add_source; print('imports OK')"

      # AI 사용량 스냅샷은 원본 저장소가 5분마다 발행한다. 프론트는 평소 raw 에서
      # 직접 읽고, 원본이 private 이 되면 이 사본으로 내려온다 — 그래서 받아 둔다.
      - name: AI 사용량 스냅샷 동기화
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AI_SNAPSHOT_TOKEN }}
        run: python -m scraper.sync_ai_snapshot

      # 러너는 해외 IP라 국내 사이트가 느리거나 막힐 수 있다. 시간 예산을 주고,
      # 실패한 사이트는 직전 수집 결과를 그대로 쓰므로 배포는 계속 진행한다.
      - name: 공고 수집
        id: collect
        run: |
          set +e
          python -m scraper.run --deadline-seconds 900
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 수집 결과 커밋
        run: |
          git config user.name  "gpu-grants-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # index.html 은 수집 때마다 ?v= 해시가 다시 찍히므로 같이 커밋한다
          # (안 하면 저장소와 배포본의 자산 버전이 어긋난다)
          git add docs/data.js docs/data.json docs/index.html data/history data/last_good
          git add docs/ai/index.html docs/ai/data/dashboard.json
          git diff --staged --quiet || git commit -m "chore: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST') 공고 수집"
          git push

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages 가 꺼져 있으면 워크플로가 켭니다
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

      # 배포까지 끝낸 뒤에 판정한다. 대비책이 받아낸 저하(=직전 데이터 사용)는 경고로,
      # 아무것도 못 가져온 진짜 고장만 실패로 남긴다. 둘을 같게 두면 매일 빨간불이라
      # 정작 고장났을 때 알아챌 수 없다.
      - name: 수집 결과 판정
        if: always()
        run: |
          code="${{ steps.collect.outputs.code }}"
          if [ "${code:-2}" -ge 2 ]; then
            echo "::error::공고 수집 실패 (exit ${code:-2}). 배포는 직전 데이터로 진행했습니다."
            exit 1
          elif [ "$code" = "1" ]; then
            echo "::warning::일부 사이트를 읽지 못해 직전 데이터를 사용했습니다. 대시보드 '수집 상태' 탭을 보세요."
          else
            echo "모든 사이트 정상 수집"
          fi
