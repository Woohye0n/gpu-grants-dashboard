# 매일 GPU 지원사업 공고를 수집해 커밋합니다. **배포는 하지 않습니다** —
# 이 커밋이 push 되면 pages.yml 이 배포합니다. 그래서 코드 변경으로도, 사내
# 서버의 스냅샷 발행으로도 같은 한 경로로 배포됩니다.
# Pages 가 꺼져 있으면 pages.yml 의 configure-pages 가 켭니다.
name: daily-collect

on:
  schedule:
    - cron: "10 0 * * *"      # 00:10 UTC = 09:10 KST
  workflow_dispatch:           # 수동 실행 버튼

permissions:
  contents: write              # 수집 결과 커밋

concurrency:
  group: daily-collect
  cancel-in-progress: true     # 새 실행이 멈춰 있는 이전 실행을 취소

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 의존성 하나가 빠지면 수집이 통째로 죽는다. 여기서 먼저 크게 실패시킨다.
      - name: 의존성 자가점검
        run: python -c "import scraper.run, scraper.probe, scraper.add_source; print('imports OK')"

      # AI 사용량 스냅샷은 **여기서 만들지 않는다.** 입력이 사내 NAS inbox 이고,
      # 무엇보다 그 내용(랩 구성원 이름, 세션 작업 경로, 계정 이메일)은 공개
      # Pages 에 올릴 것이 아니다. 사내 서버가 5분마다 만들어 자기 docs/ 에만 둔다.
      # 그래서 이 파일은 커밋도 배포도 하지 않는다 — Pages 의 /ai/ 는 "사내에서
      # 보라" 고 말한다.

      # 러너는 해외 IP라 국내 사이트가 느리거나 막힐 수 있다. 시간 예산을 주고,
      # 실패한 사이트는 직전 수집 결과를 그대로 쓰므로 배포는 계속 진행한다.
      - name: 공고 수집
        id: collect
        run: |
          set +e
          python -m scraper.run --deadline-seconds 900
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 수집 결과 커밋
        run: |
          git config user.name  "gpu-grants-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # index.html 은 수집 때마다 ?v= 해시가 다시 찍히므로 같이 커밋한다
          # (안 하면 저장소와 배포본의 자산 버전이 어긋난다)
          git add docs/data.js docs/data.json docs/index.html data/history data/last_good
          git add docs/ai/index.html
          git diff --staged --quiet || git commit -m "chore: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST') 공고 수집"
          git push

      # 결과를 판정한다. 대비책이 받아낸 저하(=직전 데이터 사용)는 경고로,
      # 아무것도 못 가져온 진짜 고장만 실패로 남긴다. 둘을 같게 두면 매일 빨간불이라
      # 정작 고장났을 때 알아챌 수 없다.
      - name: 수집 결과 판정
        if: always()
        run: |
          code="${{ steps.collect.outputs.code }}"
          if [ "${code:-2}" -ge 2 ]; then
            echo "::error::공고 수집 실패 (exit ${code:-2}). 직전 데이터가 그대로 배포됩니다."
            exit 1
          elif [ "$code" = "1" ]; then
            echo "::warning::일부 사이트를 읽지 못해 직전 데이터를 사용했습니다. 대시보드 '수집 상태' 탭을 보세요."
          else
            echo "모든 사이트 정상 수집"
          fi
