name: pages-watchdog

# Pages 배포 하나가 environment 의 waiting 단계에서 멈추면 사이트 전체가 멈춘다.
#
# pages.yml 은 concurrency group "pages" 하나로 돌고, 진행 중인 배포를 일부러 취소하지
# 않는다(cancel-in-progress: false — 그 이유는 pages.yml 주석 참고). 그 결과 waiting 에
# 걸린 런 하나가 그룹을 붙잡고 있으면, 5분마다 오는 ai-data 푸시 런은 전부 pending 으로
# 쌓였다가 다음 런에 밀려 취소된다. 스스로 풀리지 않는다.
#
# 실제로 두 번 그랬다.
#   2026-10-06 19:10 UTC — 9시간 동안 49건 연속 취소, 공개 /ai/ 가 그 시각에 멈춤
#   2026-10-07 10:50 UTC — 6시간 20분, 같은 모양
# 두 번 다 승인자 0명, wait_timer 0, 앱 보호 규칙 0개였다 — 기다릴 대상이 없는데 기다렸다.
# 정상 배포는 waiting 을 몇 초 만에 지나간다(이력: waiting → queued → in_progress → success).
#
# 그래서 waiting 에 STUCK_MIN 분 넘게 있는 pages 런은 멈춘 것으로 보고 취소한다. 다음
# ai-data 푸시 런이 최신 main + 최신 스냅샷으로 다시 배포한다. 이 저장소에는 사람이 승인
# 하는 배포 규칙이 없으므로 정상 배포를 끊을 일은 없다 — 생기면 이 감시를 먼저 고칠 것.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: pages-watchdog
  cancel-in-progress: true

jobs:
  unstick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: waiting 에 멈춘 Pages 배포 취소
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STUCK_MIN: "15"
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          runs=$(gh api "repos/$REPO/actions/workflows/pages.yml/runs?status=waiting&per_page=20" \
                   --jq '.workflow_runs[] | "\(.id) \(.created_at)"')
          if [ -z "$runs" ]; then echo "waiting 에 머문 Pages 런 없음"; exit 0; fi
          while read -r id created; do
            age=$(( (now - $(date -u -d "$created" +%s)) / 60 ))
            if [ "$age" -lt "$STUCK_MIN" ]; then
              echo "런 $id: waiting ${age}분 — 아직 정상 범위"
              continue
            fi
            echo "::warning::Pages 런 $id 가 ${age}분째 waiting — 취소합니다"
            gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null \
              || gh api -X POST "repos/$REPO/actions/runs/$id/force-cancel" >/dev/null \
              || echo "::error::런 $id 취소 실패"
          done <<< "$runs"
